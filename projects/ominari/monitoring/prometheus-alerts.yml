groups:
  - name: ominari_alerts
    interval: 30s
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second"

      # Dashboard down
      - alert: DashboardDown
        expr: up{job="ominari-dashboard"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Dashboard is down"
          description: "Dashboard has been down for more than 2 minutes"

      # Database connection issues
      - alert: DatabaseConnectionFailure
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database connection lost"
          description: "Cannot connect to PostgreSQL database"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (process_resident_memory_bytes / 1024 / 1024 / 1024) > 7
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Process using {{ $value }}GB of memory"

      # Paper trading issues
      - alert: PaperTradingStalled
        expr: rate(paper_trades_total[10m]) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No paper trades in 30 minutes"
          description: "Paper trading may be stalled"

      # Edge calculation issues
      - alert: NoEdgeCalculations
        expr: rate(edge_calculations_total[5m]) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Edge calculations stopped"
          description: "No edge calculations in the last 10 minutes"

      # WebSocket disconnections
      - alert: HighWebSocketDisconnects
        expr: rate(websocket_disconnections_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High WebSocket disconnect rate"
          description: "{{ $value }} disconnects per second"