[project]
name = "ominari"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"alembic==1.16.4",
	"eth_utils==5.1.0",
	"fuzzywuzzy==0.18.0",
	"grpcio>=1.74.0",
	"grpcio-tools>=1.74.0",
	"ipython==8.12.3",
	"Markdown==3.8.2",
	"markdown2==2.5.4",
	"matplotlib==3.10.5",
	"numpy==2.3.2",
	"pandas==2.3.1",
	"pdfkit==1.0.0",
	"protobuf==6.31.1",
	"python-dotenv==1.1.1",
	"python_dateutil==2.9.0.post0",
	"Requests==2.32.4",
	"scipy==1.16.1",
	"SQLAlchemy==2.0.36",
	"psutil>=5.9.0",
	"fastapi>=0.100.0",
	"uvicorn>=0.23.0",
	"pydantic>=2.0.0",
	"pydantic-settings>=2.0.0",
	"aiohttp>=3.8.0",
	"gql>=3.4.0",
	"web3>=6.0.0",
	"prometheus-client>=0.17.0",
	"pytest>=7.0.0",
	"pytest-asyncio>=0.21.0",
	"scikit-learn>=1.3.0",
	"seaborn>=0.12.0",
	"PyYAML>=6.0.0",
	"pinkhaus-models",
	"flask>=3.1.2",
	"flask-socketio>=5.5.1",
	"redis>=6.4.0",
	"psycopg2-binary>=2.9.10",
	"cryptography>=46.0.3",
	"eth-account>=0.13.7",
]

[project.scripts]
#

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ominari"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
pinkhaus-models = { path = "../pinkhaus-models" }

[dependency-groups]
dev = [
	"ruff>=0.12.4",
]
