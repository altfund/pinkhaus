name: Auto Deploy and Run Ominari

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  test-and-validate:
    name: Test and Validate
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Create virtual environment and install dependencies
      run: |
        uv venv
        source .venv/bin/activate
        uv sync
    
    - name: Validate imports
      run: |
        source .venv/bin/activate
        python -c "import main; print('✓ Main module OK')"
        python -c "from web_dashboard_real_odds import app; print('✓ Dashboard OK')"
        python -c "from automated_trading_system import AutomatedTradingSystem; print('✓ Trading system OK')"
    
    - name: Run tests
      run: |
        source .venv/bin/activate
        python -m pytest tests/ -v || echo "No tests found yet"

  deploy-local:
    name: Deploy to Local Machine
    needs: test-and-validate
    runs-on: self-hosted  # Requires self-hosted runner
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Stop existing Ominari instance
      run: |
        echo "🛑 Stopping existing Ominari services..."
        pkill -f "python.*main.py" || true
        pkill -f "web_dashboard" || true
        pkill -f "automated_trading" || true
        pkill -f "trading_performance" || true
        sleep 3
    
    - name: Setup environment
      run: |
        echo "🔧 Setting up environment..."
        export PG_PORT=5999
        export PG_DB=ominari_production
        export DATABASE_URL="postgresql://ominari_user:ominari_2025_secure@localhost:5999/ominari_production"
        echo "PG_PORT=$PG_PORT" >> $GITHUB_ENV
        echo "PG_DB=$PG_DB" >> $GITHUB_ENV
        echo "DATABASE_URL=$DATABASE_URL" >> $GITHUB_ENV
    
    - name: Update dependencies
      run: |
        echo "📦 Updating dependencies..."
        uv sync
    
    - name: Start Ominari Trading System
      run: |
        echo "🚀 Starting Ominari Trading System..."
        nohup .venv/bin/python main.py > /tmp/ominari_auto.log 2>&1 &
        echo $! > /tmp/ominari.pid
        echo "✅ Started with PID: $(cat /tmp/ominari.pid)"
        sleep 15  # Give services time to start
    
    - name: Verify deployment
      run: |
        echo "🔍 Verifying deployment..."
        for i in {1..30}; do
          if curl -sf http://localhost:8888/health > /dev/null; then
            echo "✅ Dashboard is healthy!"
            break
          fi
          echo "⏳ Waiting for services to start... ($i/30)"
          sleep 2
        done
        
        # Final health check
        if curl -sf http://localhost:8888/health; then
          echo "✅ Ominari Trading System is running!"
          echo "📊 Dashboard: http://localhost:8888"
          echo "📈 Performance: http://localhost:8889"
        else
          echo "❌ Failed to start Ominari!"
          echo "📋 Logs:"
          tail -50 /tmp/ominari_auto.log
          exit 1
        fi
    
    - name: Setup auto-restart
      run: |
        echo "🔄 Setting up auto-restart on failure..."
        # Create systemd service if not exists
        if [ ! -f /etc/systemd/system/ominari.service ]; then
          sudo cp infrastructure/systemd/ominari.service /etc/systemd/system/ || true
          sudo systemctl daemon-reload || true
          sudo systemctl enable ominari || true
        fi

  deploy-docker:
    name: Deploy with Docker
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[docker]')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -f infrastructure/docker/Dockerfile.production -t ominari:latest .
    
    - name: Run with Docker Compose
      run: |
        docker-compose up -d
        sleep 30
        docker-compose ps
        curl -f http://localhost:8888/health || exit 1

  deploy-cloud:
    name: Deploy to Cloud
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to cloud provider
      run: |
        echo "☁️ Cloud deployment configuration needed"
        echo "Add your cloud credentials as GitHub secrets:"
        echo "- AWS: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY"
        echo "- GCP: GCP_SERVICE_ACCOUNT_KEY"
        echo "- Azure: AZURE_CREDENTIALS"
        
        # Uncomment for your cloud provider:
        
        # AWS ECS Deployment
        # if [[ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]]; then
        #   echo "Deploying to AWS ECS..."
        #   # Configure AWS credentials
        #   # Build and push to ECR
        #   # Update ECS service
        # fi
        
        # Google Cloud Run
        # if [[ -n "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" ]]; then
        #   echo "Deploying to Google Cloud Run..."
        #   # Configure GCP credentials
        #   # Build and push to GCR
        #   # Deploy to Cloud Run
        # fi

  notification:
    name: Send Notification
    needs: [deploy-local, deploy-docker, deploy-cloud]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
    - name: Send success notification
      if: success()
      run: |
        echo "✅ Ominari successfully deployed from commit ${{ github.sha }}"
        echo "🚀 The trading system is now running automatically!"
        # Add Slack/Discord/Email notification here
    
    - name: Send failure notification
      if: failure()
      run: |
        echo "❌ Ominari deployment failed!"
        echo "Check the logs at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        # Add Slack/Discord/Email notification here